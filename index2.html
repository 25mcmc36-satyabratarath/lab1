<!DOCTYPE html>
<html>
<head>
    <title>Custom jQuery Tab Plugin</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="jquery.simpleTabs.js"></script>
</head>
<body>

<h2>Tabbed Navigation Plugin Demo</h2>

<div id="myTabs">
    <ul class="tab-links">
        <li data-tab="home">Home</li>
        <li data-tab="about">About</li>
        <li data-tab="contact">Contact</li>
    </ul>

    <div class="tab-content" id="home">
        <h3>Home</h3>
        <p>Welcome to our homepage content.</p>
    </div>

    <div class="tab-content" id="about">
        <h3>About</h3>
        <p>This is the about section of our website.</p>
    </div>

    <div class="tab-content" id="contact">
        <h3>Contact</h3>
        <p>Contact us at example@email.com</p>
    </div>
</div>

<script>
    $("#myTabs").simpleTabs({
        activeClass: "active-tab",
        animationSpeed: 400,
        defaultTab: "home"
    });
</script>

</body>
</html>
